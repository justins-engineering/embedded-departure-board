# Hardening
CONFIG_STACK_SENTINEL=n
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# External SPI Flash (MCUboot secondary slot lives here -- see this board's
# overlay for the devicetree partition nodes; no Partition Manager needed)
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Allow writing to the flash at runtime
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Neopixels over SPI
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# NRF Modem configurations
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_FAULT_STRERROR=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
# =y since the pigeon integration moved to modem TLS: lte_manager.c
# provisions ONLY the pigeon CA cert into the modem store with this
# (pre-registration, compare-before-write). Swiftly's cert and socket stay
# on native TLS/the native store regardless -- custom_http_client.c no
# longer keys its socket type off this symbol.
CONFIG_MODEM_KEY_MGMT=y

# The open-FD limit (ZVFS_OPEN_MAX) is auto-sized from subsystem reservations.
# Poll entries per poll() call: one per modem socket, so any caller can poll
# every offloaded socket at once.
CONFIG_ZVFS_POLL_MAX=8

# Occasionally the TLS setup take a long time and we don't want to reset just for that
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000

# NRF LTE link control library
CONFIG_LTE_LINK_CONTROL=y

# LTE Power Saving Mode
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
# Request periodic TAU of 12 hours
CONFIG_LTE_PSM_REQ_RPTAU="00101100"
# Set Requested Active Time (RAT) to 10 seconds.
CONFIG_LTE_PSM_REQ_RAT="00000101"

# NRF net configurations
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# Disable Duplicate Address Detection (DAD), not properly implemented for offloaded interfaces
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# TF-M configurations
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_CMAKE_BUILD_TYPE_RELEASE=y

# TF-M logging: NOT silenced, and that is load-bearing, not cosmetic.
# CONFIG_TFM_LOG_LEVEL_SILENCE=y makes this board's TF-M build fail to
# ever start the non-secure image -- MCUboot validates and jumps, then
# nothing: no app banner, no logs, no telemetry, ever (NCS 3.4.0,
# bench-bisected 2026-08-02 down to a single-variable A/B: identical
# builds with SILENCE=y never boot, SILENCE=n boot clean). This is why
# this branch's release profile had NEVER run on hardware -- the old
# "silent release console" was blamed on wiring, then on log levels,
# but the image was genuinely dead. Until the underlying TF-M defect is
# understood/fixed upstream, releases keep TF-M logs on, sharing UART0
# with the app console like the debug profile always has (the few [INF]
# lines at boot are the price of a firmware that boots).
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=n

# All crypto runs in TF-M, which stages every PSA call's input and output in
# this scratch buffer. It must fit our largest call: decrypting a full 16 KB
# TLS record (~16.4 KB in + ~16.4 KB out).
CONFIG_TFM_CRYPTO_IOVEC_BUFFER_SIZE=36864

# The CryptoCell blob rejects TLS 1.2 ECDHE key agreement; use Oberon instead.
# ECDHE runs once per connection, so software speed is fine.
CONFIG_PSA_USE_CC3XX_KEY_AGREEMENT_DRIVER=n

# Crypto drivers
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y

# Enable MbedTLS
CONFIG_MBEDTLS=y

# MbedTLS configurations
CONFIG_MBEDTLS_ENABLE_HEAP=y
## Crypto runs in TF-M, so this heap only holds the SSL I/O buffers, X509
## parsing, and session state for one TLS connection at a time. Since the
## pigeon integration moved its own TLS into the modem (sec tag 2, board
## conf), Swiftly is the ONLY mbedTLS consumer -- the single-connection
## model got stronger, not weaker. Peak model: 16.6K IN + 4.4K OUT record
## buffers + ssl/handshake/X509 transients ~5-7K = ~28K; 32768 keeps ~4.7K
## slack over the model and ran green on the bench through repeated
## Swiftly handshakes at this size (RAM-diet verification flash,
## 2026-08-08; second trim from 40960 -> 36864 -> 32768). An undersized
## heap fails LOUDLY (handshake alloc error, logged) rather than
## corrupting -- bump this back first if Swiftly TLS ever starts failing
## with memory/alloc errors.
CONFIG_MBEDTLS_HEAP_SIZE=32768
## Servers pick their own record size, so IN must stay at the TLS maximum.
## We only ever send small request headers, looping on partial writes.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# MbedTLS net configurations
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=8

# Enable TLS credentials management subsystem
CONFIG_TLS_CREDENTIALS=y
# Sizing landmine, learned live (2026-08-02): each credential in this
# backend is ONE TF-M PS asset capped at CONFIG_TFM_PS_MAX_ASSET_SIZE
# (2048) inside the 8KB tfm_ps_partition -- a multi-root CA bundle
# (keys/public/swiftly-ca-full.crt) does NOT fit, one-per-tag or
# otherwise; tls_credential_add fails -EIO at boot and takes LTE + the
# display down. lte_manager.c BUILD_ASSERTs the active cert against the
# cap. If the full bundle is ever activated (see its README section),
# either grow the PS partition or switch this to
# CONFIG_TLS_CREDENTIALS_BACKEND_VOLATILE (public certs need neither
# confidentiality nor PS persistence -- but revisit before storing any
# actual secret here).
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y

# MbedTLS module configurations
CONFIG_MBEDTLS_PK_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y

CONFIG_MBEDTLS_SSL_SRV_C=n
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_MBEDTLS_CCM_C=n
CONFIG_MBEDTLS_HMAC_DRBG_C=n
CONFIG_MBEDTLS_CIPHER_MODE_CBC=n
CONFIG_MBEDTLS_CIPHER_MODE_CTR=n

# Key exchange configurations
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

# Buffer-sizing workaround, no PSK is used: PSA-only builds shrink the TLS 1.2
# premaster buffer to 1 byte (dummy MBEDTLS_ECP_MAX_BITS), breaking ECDHE.
# PSK adds a 68-byte union member that fits the P-256 shared secret.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=n

# Key type configurations
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# Cipher configurations
CONFIG_PSA_WANT_ALG_CTR=y

CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=n

# Key agreement configurations
CONFIG_PSA_WANT_ALG_ECDH=y

# Key derivation function configurations
# The TLS 1.2 master-secret PRF is a PSA operation; every handshake needs it.
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=n

# MAC configurations
CONFIG_PSA_WANT_ALG_HMAC=y

# AEAD configurations
CONFIG_PSA_WANT_ALG_GCM=y

# Asymmetric signature configurations
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# ECC curve configurations
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# RNG configurations
CONFIG_PSA_WANT_ALG_CTR_DRBG=y

# Enable SNI
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

# Enable SSL renegotiation
CONFIG_MBEDTLS_SSL_RENEGOTIATION=y

# Enable SSL session tickets
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y
