# Copy this file to app/prj.local.conf and fill in the values for the sign being
# built. prj.local.conf is untracked: which stop a sign serves, and whose
# predictions API it reads, are properties of a deployment rather than of this
# source tree.
#
# It is merged after prj.conf and sign.conf, so anything set here wins.

# The stop this sign serves, as the predictions API identifies it.
CONFIG_STOP_ID="00000"

# The predictions API path for the transit agency being queried. The hostname is
# CONFIG_SWIFTLY_API_HOSTNAME in app/Kconfig; only the path is agency specific.
CONFIG_SWIFTLY_API_PATH="/real-time/example-agency/predictions"

# Optional. Naming the sign in the boot banner makes a console session say which
# board it is attached to.
# CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Embedded Departure Board Example"
