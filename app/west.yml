# Import requirements for nRF9160 Feather Examples and Drivers
manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      repo-path: sdk-nrf
      remote: ncs
      revision: v3.4.0
      import:
         name-allowlist:
          - cmsis_6
          - hal_nordic
          - mbedtls
          - mcuboot
          - nrfxlib
          - oberon-psa-crypto
          - segger
          - tf-psa-crypto
          - trusted-firmware-m
          - zcbor
          - zephyr

    # Multiplexer Driver
    - name: multiplexer
      url: https://github.com/justins-engineering/zephyr-multiplexer
      # Explicit SHA rather than a branch name, for the same reason as pigeon
      # below: a branch resolves to whatever it has become since the build.
      revision: 09a535cecfa8ef3726e026ac58a431aedfc9427c
      path: multiplexer

    # Pigeon: PidgeIoT device client library (device shadow / telemetry /
    # remote stop config). A real west project here, not a local symlink
    # (contrast the sibling pigeon-examples repo, which symlinks a live
    # ~/pigeon checkout for active co-development) -- this is a product
    # repo, not a dev sandbox, and needs a build that reproduces on any
    # machine/CI runner without depending on a local out-of-tree checkout
    # existing. zephyr/module.yml wires it in automatically once fetched;
    # no ZEPHYR_EXTRA_MODULES/CMakeLists changes needed.
    #
    # Pinned to an explicit commit, never a branch. A shipped image must be
    # rebuildable from this manifest alone; `revision: main` instead resolves
    # to whatever the library has become since, so the artifact that was
    # tested and the artifact a rebuild produces can silently differ with no
    # change to this repo at all. Advancing this pin is a deliberate,
    # separately-tested change, not a side effect of fetching.
    - name: pigeon
      url: https://github.com/justins-engineering/pigeon
      revision: 7b2824318e1d41ed1377b79f924e80d7d90dc2e8
      path: pigeon

  self:
    path: app
