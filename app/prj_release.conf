# See prj.conf's comment: TFM_EXPERIMENTAL is unconditionally enabled by this
# TF-M profile on this SoC, reproduced on a stock hello_world -- not this
# app's fault, but fatal under this project's strict Kconfig-warnings policy.
CONFIG_WARN_EXPERIMENTAL=n

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Enable FPU & FPU sharing
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Reset Reason and Reboot
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Power Management
CONFIG_PM_DEVICE=y

# Compiler optimizations
# Optimize for speed since space isn't a huge concern for this app
CONFIG_SPEED_OPTIMIZATIONS=y

# Flash operations.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_SETTINGS=y

# Watchdog timer
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Multiplexor drivers
CONFIG_GPIO=y
CONFIG_MULTIPLEXER=y

# Counter
CONFIG_COUNTER=y

# I2C
CONFIG_I2C=y

# PWM
CONFIG_PWM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_BUF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=n

# SNTP
CONFIG_SNTP=y

# Stack and heap configurations
# The routes JSON itself lives in static buffers (update_stop.c's json_buf,
# sized by CONFIG_STOP_JSON_BUF_SIZE) -- main's stack mostly carries the
# Swiftly request's native-TLS/mbedTLS call frames. 16384 is 2x the
# TLS-proven 8192 precedent (pigeon-examples' wifi_init); the previous
# 24576 dated from "we have plenty of memory", which stopped being true
# once the pigeon client thread and its buffers moved in (RAM ~94%).
CONFIG_MAIN_STACK_SIZE=16384
# Increase heap size for networking operations
CONFIG_HEAP_MEM_POOL_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Enable MCUmgr and dependencies.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_MCUMGR=y
# Previously implied by another symbol; NCS 3.4.0 needs this set explicitly.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Increase MCUmgr transfer speeds
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# Some MCUmgr command handlers require a large stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Enable most MCUmgr core commands.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# Hardening
CONFIG_FORTIFY_SOURCE_COMPILE_TIME=y
CONFIG_STACK_SENTINEL=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_POINTER_RANDOM=100
CONFIG_BOOT_BANNER=n
CONFIG_BUILD_OUTPUT_STRIPPED=y
CONFIG_EARLY_CONSOLE=n
CONFIG_FAULT_DUMP=0
CONFIG_EXCEPTION_DEBUG=n
CONFIG_PRINTK=n
CONFIG_NCS_BOOT_BANNER=n

# Logging
CONFIG_LOG=y
# 1 = Error, 2 = Warn, 3 = Info, 4 = Debug
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_MINIMAL=y

# Debugging
CONFIG_DEBUG=n

# Pigeon (PidgeIoT device management) -- see prj.conf's comment for the base
# HTTPS connector config, shared with this profile via the same values below.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y
CONFIG_PIGEON_HTTPS_SEC_TAG=2
# Matches this profile's own CONFIG_LOG_DEFAULT_LEVEL=2 above.
CONFIG_PIGEON_LOG_LEVEL=2
# Task #45's wedge-recovery pair, appropriate for a field-deployed sign with
# no operator console (unlike prj.conf's dev-profile build, which leaves
# these off per pigeon's own Kconfig help). This REPLACES the previous
# CONFIG_RESET_ON_FATAL_ERROR=y (nrf/lib/fatal_error) -- both define a
# strong, non-weak k_sys_fatal_error_handler(), so only one can be linked in;
# pigeon's is the standard mitigation shared across every PidgeIoT-managed
# device, so this project adopts it in place of NCS's own equivalent rather
# than fighting the two for one symbol slot.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
# CONFIG_PIGEON_WATCHDOG stays OFF: this board's watchdog0 devicetree alias
# is the same physical wdt0 peripheral watchdog_app.c already owns end-to-end
# (wdt_install_timeout/wdt_setup, fed throughout main.c's loop), and the two
# cannot share it. Traced through the vendored sources rather than assumed:
# watchdog_init() runs before pigeon_client_init() in main(), so by the time
# pigeon_watchdog_start() calls task_wdt_init(wdt0), wdt_nrf_install_timeout()
# (zephyr/drivers/watchdog/wdt_nrfx.c) sees data->enabled and returns -EBUSY;
# task_wdt_init() then bails BEFORE arming even its software timer, so with =y
# pigeon's watchdog is deterministically inert -- no software channel either,
# just a task_wdt_init-failed error logged every boot. Worse, if init order
# ever flipped, task_wdt_add() would wdt_setup() a ~300ms-window channel first
# and watchdog_app.c's own install would -EBUSY into main()'s `goto reset` --
# a boot loop. The app's proven hardware watchdog covers the liveness-stall
# shape; CONFIG_PIGEON_REBOOT_ON_FATAL above covers the fatal-error shape.
CONFIG_PIGEON_WATCHDOG=n
