# See prj.conf's comment: TFM_EXPERIMENTAL is unconditionally enabled by this
# TF-M profile on this SoC, reproduced on a stock hello_world -- not this
# app's fault, but fatal under this project's strict Kconfig-warnings policy.
CONFIG_WARN_EXPERIMENTAL=n

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Enable FPU & FPU sharing
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Reset Reason and Reboot
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Power Management
CONFIG_PM_DEVICE=y

# Compiler optimizations
# Optimize for speed since space isn't a huge concern for this app
CONFIG_SPEED_OPTIMIZATIONS=y

# Flash operations.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_SETTINGS=y

# Watchdog timer
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Multiplexor drivers
CONFIG_GPIO=y
CONFIG_MULTIPLEXER=y

# Counter
CONFIG_COUNTER=y

# I2C
CONFIG_I2C=y

# PWM
CONFIG_PWM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_BUF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=n

# SNTP
CONFIG_SNTP=y

# Stack and heap configurations
# Main's stack has two big, SEQUENTIAL (never nested) consumers per
# update_stop pass: the Swiftly native-TLS/mbedTLS request frames, then
# parse_swiftly_json's jsmn token array -- a stack LOCAL of
# STOP_TOK_COUNT (742) * 16B = ~11.9KB (the original "needs to be larger
# than expected routes JSON" comment was literal). 12288 was tried on the
# way down from the pre-integration 24576 and is a HARD FLOOR VIOLATION,
# not a theory: on real hardware (2026-08-01 bench) it stack-overflowed
# main (MPU guard USAGE FAULT, faulting thread == z_main_thread by ELF
# symbol match) on the first update_stop pass, every boot -- the token
# array alone nearly fills 12288. 16384 covers max(TLS path, parse path)
# and survived many live cycles; funded by MBEDTLS_HEAP_SIZE
# 40960->36864 in the board confs (mbedTLS serves only Swiftly's single
# connection now that pigeon rides modem TLS). MPU_STACK_GUARD stays the
# loud backstop. Do NOT grow STOP_TOK_COUNT/STOP_MAX_ROUTES without
# redoing this arithmetic -- see parse_swiftly.c.
CONFIG_MAIN_STACK_SIZE=16384
# Increase heap size for networking operations
CONFIG_HEAP_MEM_POOL_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Enable MCUmgr and dependencies.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_MCUMGR=y
# Previously implied by another symbol; NCS 3.4.0 needs this set explicitly.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Increase MCUmgr transfer speeds
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# Some MCUmgr command handlers require a large stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Enable most MCUmgr core commands.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# Hardening
CONFIG_FORTIFY_SOURCE_COMPILE_TIME=y
CONFIG_STACK_SENTINEL=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_POINTER_RANDOM=100
CONFIG_BOOT_BANNER=n
CONFIG_BUILD_OUTPUT_STRIPPED=y
CONFIG_EARLY_CONSOLE=n
CONFIG_FAULT_DUMP=0
CONFIG_EXCEPTION_DEBUG=n
CONFIG_PRINTK=n
CONFIG_NCS_BOOT_BANNER=n

# Logging
CONFIG_LOG=y
# 1 = Error, 2 = Warn, 3 = Info, 4 = Debug
CONFIG_LOG_DEFAULT_LEVEL=2
# Deferred mode (was minimal): required for CONFIG_PIGEON_LOG_UPLOAD's
# dictionary backend to see any records -- see prj.conf's fuller comment.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536

# Debugging
CONFIG_DEBUG=n

# Pigeon (PidgeIoT device management) -- see prj.conf's comment for the base
# HTTPS connector config, shared with this profile via the same values below.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y
CONFIG_PIGEON_HTTPS_SEC_TAG=2
# The full runtime-tunable target_config (stop_id, both NTP servers, four
# interval/retry knobs, the 6-entry "displays" route layout, plus a
# firmware target) outgrows the pigeon library's 320-byte default config
# cap -- an over-cap config truncates mid-JSON and fails the parse, it
# doesn't degrade. 768 fits the worst-case ack (~330B scalars + ~175B
# displays + ~140B firmware = ~645B) with headroom; the library's receive
# buffers scale off this (~2.5x across two static buffers), paid for by
# the offsets below (FOTA chunk, log buffers).
CONFIG_PIGEON_SHADOW_CONFIG_MAX=768
# Matches this profile's own CONFIG_LOG_DEFAULT_LEVEL=2 above.
CONFIG_PIGEON_LOG_LEVEL=2
# See prj.conf's comments for both blocks below.
CONFIG_PIGEON_TELEMETRY_MAX_KEYS=4
CONFIG_PIGEON_LOG_UPLOAD=y
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=256
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=128
CONFIG_PIGEON_LOG_UPLOAD_MAX_INTERVAL_MS=300000
# FOTA (task #3): shadow "firmware" target -> chunked, device-authed Range
# download straight into the external-flash MCUboot secondary slot (slot1 on
# the w25q32jv, board overlay) -> streamed sha256 verify -> one-time test
# swap -> graceful reboot. The image confirms itself only after its first
# successful departure fetch (fota.c confirm_image_if_healthy); until then
# MCUboot reverts on reset -- that's the anti-brick net, not a bug.
CONFIG_PIGEON_FOTA=y
# NCS dfu_target backend: the exact write/schedule path hardware-verified on
# real nRF9160 (pigeon tasks #23-24); pigeon's vendor-neutral default has no
# hardware pass yet. This is an NCS workspace, so the dependency is free.
CONFIG_PIGEON_FOTA_NCS=y
# DFU_TARGET drags its nRF91 modem-delta backend in by default; this sign
# only ever updates its application image.
CONFIG_DFU_TARGET_MODEM_DELTA=n
# 512 quarters the static buffer cost (chunk + dfu staging) vs the 2048
# default in this RAM-bound image -- the second halving (1024 -> 512,
# 2026-08-02) funds the SHADOW_CONFIG_MAX bump for the "displays" key.
# Price: ~4x the Range requests of the default (~500 for a ~250KB image,
# roughly 6-12 min on LTE-M with modem-TLS session reuse). Never raise
# past 2048 on this board: pigeon rides modem TLS here, and oversized
# responses hit the same modem recv limitation that pushed Swiftly off
# modem TLS (git 2639259).
CONFIG_PIGEON_FOTA_CHUNK_SIZE=512
# CONFIG_PIGEON_FOTA_CURRENT_VERSION is NOT set here on purpose: it is
# derived from app/VERSION by CMakeLists.txt so it can never drift from the
# image's real version.
# Task #45's wedge-recovery pair, appropriate for a field-deployed sign with
# no operator console (unlike prj.conf's dev-profile build, which leaves
# these off per pigeon's own Kconfig help). This REPLACES the previous
# CONFIG_RESET_ON_FATAL_ERROR=y (nrf/lib/fatal_error) -- both define a
# strong, non-weak k_sys_fatal_error_handler(), so only one can be linked in;
# pigeon's is the standard mitigation shared across every PidgeIoT-managed
# device, so this project adopts it in place of NCS's own equivalent rather
# than fighting the two for one symbol slot.
CONFIG_PIGEON_REBOOT_ON_FATAL=y
# CONFIG_PIGEON_WATCHDOG stays OFF: this board's watchdog0 devicetree alias
# is the same physical wdt0 peripheral watchdog_app.c already owns end-to-end
# (wdt_install_timeout/wdt_setup, fed throughout main.c's loop), and the two
# cannot share it. Traced through the vendored sources rather than assumed:
# watchdog_init() runs before pigeon_client_init() in main(), so by the time
# pigeon_watchdog_start() calls task_wdt_init(wdt0), wdt_nrf_install_timeout()
# (zephyr/drivers/watchdog/wdt_nrfx.c) sees data->enabled and returns -EBUSY;
# task_wdt_init() then bails BEFORE arming even its software timer, so with =y
# pigeon's watchdog is deterministically inert -- no software channel either,
# just a task_wdt_init-failed error logged every boot. Worse, if init order
# ever flipped, task_wdt_add() would wdt_setup() a ~300ms-window channel first
# and watchdog_app.c's own install would -EBUSY into main()'s `goto reset` --
# a boot loop. The app's proven hardware watchdog covers the liveness-stall
# shape; CONFIG_PIGEON_REBOOT_ON_FATAL above covers the fatal-error shape.
CONFIG_PIGEON_WATCHDOG=n
