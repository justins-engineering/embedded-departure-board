# Raised-verbosity overlay for a soak whose job is to explain a hang.
#
# Layered on top of prj_release.conf rather than edited into it, so a release
# build cannot pick it up by accident:
#
#   west build --sysbuild ./app -b circuitdojo_feather/nrf9160/ns -d <dir> -- \
#     -DFILE_SUFFIX=release \
#     -Dapp_EXTRA_CONF_FILE=<abs path to this file>
#
# Nothing outside the logging pipeline changes. The release profile's WRN
# floor compiles INFO out entirely, which makes the silence before a watchdog
# reset uninformative: there is no way to tell where the loop stopped because
# there was nothing it could have printed. INFO restores a per-cycle
# breadcrumb trail (request sent, response code, bytes received, tokens
# parsed, routes matched, display writes, lux, PWM) so the last line before a
# hang names the phase it hung in.

# 1 = Error, 2 = Warn, 3 = Info, 4 = Debug
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PIGEON_LOG_LEVEL=3

# DEBUG is deliberately not enabled anywhere. The three suspects were each
# checked against their actual call sites: watchdog and lte_manager have no
# LOG_DBG at all, so level 4 buys nothing there; main's two LOG_DBG sites sit
# inside the 100ms loop pass and would emit ~10 records/s, three orders of
# magnitude over the whole INFO budget below; custom_http_client's would dump
# both header buffers in full on every request. INFO already brackets the
# request path closely enough to say which phase stopped.

# Sized for the INFO burst, not the WRN trickle: one update_stop pass emits
# roughly 17 records back to back (one per route, one per matched display,
# plus the HTTP and display lines) while main holds the CPU, and in deferred
# mode they all sit here until the log thread runs. The former 768 left no
# room for that burst plus whatever is already in flight.
CONFIG_LOG_BUFFER_SIZE=2048
# Bigger formatting frames come with the higher level; the former 1024 was
# measured against WRN-level volume only.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# The upload ring has to be resized with the floor or the instrumentation
# becomes the experiment. INFO produces ~19 B/s of dictionary records; against
# the former 256-byte ring and 128-byte batch threshold that is a flush every
# ~7s, i.e. a continuous run of HTTPS POSTs contending for the same pigeon
# transport lock this soak is meant to observe, and dropping most of the
# records anyway. 2048/1536 puts a flush at roughly 80s and keeps the batch
# whole. Costs 2x the ring size in RAM (the flush buffer is a static of the
# same size); the image has ~12.8KB of SRAM headroom.
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=2048
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=1536
