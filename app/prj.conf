# TF-M's "profile not set" build (see CONFIG_TFM_PROFILE_TYPE_NOT_SET in this
# board's conf) unconditionally enables TFM_EXPERIMENTAL
CONFIG_WARN_EXPERIMENTAL=n

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Enable FPU & FPU sharing
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Reset Reason and Reboot
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Power Management
CONFIG_PM_DEVICE=y

# Compiler optimizations
# Optimize for speed since space isn't a huge concern for this app
CONFIG_SPEED_OPTIMIZATIONS=y

# Flash operations.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_SETTINGS=y

# Watchdog timer
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Multiplexor drivers
CONFIG_GPIO=y
CONFIG_MULTIPLEXER=y

# Counter
CONFIG_COUNTER=y

# I2C
CONFIG_I2C=y

# PWM
CONFIG_PWM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_BUF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=n

# SNTP
CONFIG_SNTP=y

# Stack and heap configurations
# Main's stack has two big, SEQUENTIAL (never nested) consumers per
# update_stop pass: the Swiftly native-TLS/mbedTLS request frames, then
# parse_swiftly_json's jsmn token array -- a stack LOCAL of
# STOP_TOK_COUNT (742) * 16B = ~11.9KB (the original "needs to be larger
# than expected routes JSON" comment was literal). 12288 was tried on the
# way down from the pre-integration 24576 and is a HARD FLOOR VIOLATION,
# not a theory: on real hardware (2026-08-01 bench) it stack-overflowed
# main (MPU guard USAGE FAULT, faulting thread == z_main_thread by ELF
# symbol match) on the first update_stop pass, every boot -- the token
# array alone nearly fills 12288. 16384 covers max(TLS path, parse path)
# and survived many live cycles; funded by MBEDTLS_HEAP_SIZE
# 40960->36864 in the board confs (mbedTLS serves only Swiftly's single
# connection now that pigeon rides modem TLS). MPU_STACK_GUARD stays the
# loud backstop. Do NOT grow STOP_TOK_COUNT/STOP_MAX_ROUTES without
# redoing this arithmetic -- see parse_swiftly.c.
CONFIG_MAIN_STACK_SIZE=16384
# Increase heap size for networking operations
CONFIG_HEAP_MEM_POOL_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Enable MCUmgr and dependencies.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Increase MCUmgr transfer speeds
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# Some MCUmgr command handlers require a large stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Enable most MCUmgr core commands.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# Hardening
CONFIG_FORTIFY_SOURCE_COMPILE_TIME=y
CONFIG_STACK_SENTINEL=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_POINTER_RANDOM=100

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Embedded Departure Board"

# Logging
CONFIG_LOG=y
# 1 = Error, 2 = Warn, 3 = Info, 4 = Debug
CONFIG_LOG_DEFAULT_LEVEL=2

# Deferred mode (was minimal): CONFIG_PIGEON_LOG_UPLOAD's dictionary backend
# is a real log backend, and minimal mode never dispatches to backends at
# all -- the ring buffer would simply stay empty. The UART console backend
# still renders human-readable text in deferred mode (dictionary encoding is
# per-backend, not global), it's just flushed asynchronously by the log
# processing thread. That thread only runs at all because main's loop now
# sleeps between passes instead of k_cpu_idle()ing (see main.c).
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536

