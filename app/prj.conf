# Pigeon (PidgeIoT device management, see app/west.yml + net/pigeon_client.c)
# HTTPS connector: this sign's day job (the Swiftly fetch loop) is already
# plain HTTPS over the same LTE link, so no protocol/socket-type conflict.
# CONFIG_PIGEON_ENDPOINT/CONFIG_PIGEON_TOKEN are real device secrets --
# supplied via the gitignored prj.local.conf (see this file's CMakeLists.txt
# handling), never committed here.
CONFIG_PIGEON=y
CONFIG_PIGEON_CONNECTOR_HTTPS=y
# Sec tag 2: 0=NO_SEC_TAG, 1=SWIFTLY_SEC_TAG (see net/lte_manager.h's enum
# tls_sec_tags) -- the CA cert provisioned under it is GTS Root R4
# (net/lte_manager.c), since api.pidgeiot.com sits behind the Google Trust
# Services chain. Provisioned into the MODEM's credential store
# (CONFIG_MODEM_KEY_MGMT, board conf): pigeon's sockets are plain offloaded
# IPPROTO_TLS_1_2, so their TLS runs inside the modem -- deliberately NOT
# sharing Swiftly's native mbedTLS path, whose 40KB heap is sized for one
# connection at a time (board conf) and would make concurrent pigeon and
# Swiftly handshakes fight over it.
CONFIG_PIGEON_HTTPS_SEC_TAG=2
# The full runtime-tunable target_config (stop_id, both NTP servers, four
# interval/retry knobs, the 6-entry "displays" route layout, plus a
# firmware target) outgrows the pigeon library's 320-byte default config
# cap -- an over-cap config truncates mid-JSON and fails the parse, it
# doesn't degrade. 768 fits the worst-case ack (~330B scalars + ~175B
# displays + ~140B firmware = ~645B) with headroom; the library's receive
# buffers scale off this (~2.5x across two static buffers), paid for by
# the offsets below (FOTA chunk, log buffers).
CONFIG_PIGEON_SHADOW_CONFIG_MAX=768
CONFIG_PIGEON_LOG_LEVEL=4
# Back to the library default 8 slots (was pinned to 4 during the
# RAM-starved era): this app stages 4 keys today, and the diet bought
# back the ~1.3KB of headroom so new keys (e.g. occupancy metrics) don't
# require a sizing dance.
CONFIG_PIGEON_TELEMETRY_MAX_KEYS=8
# Remote dictionary logs (task #2): Zephyr dictionary-encoded records ring-
# buffered in the pigeon module and POSTed to <endpoint>/logs. Decoding
# needs this build's log_dictionary.json artifact -- see the README bench
# section. 5min max flush interval matches the poll cadence's LTE budget;
# the 256B batch threshold flushes sooner under bursts. Ring + flush buffer
# cost 2x BUF_SIZE of static RAM; at the WRN default level 512 holds a
# healthy burst (~10 dictionary records), and this build is RAM-bound.
CONFIG_PIGEON_LOG_UPLOAD=y
CONFIG_PIGEON_LOG_UPLOAD_BUF_SIZE=256
CONFIG_PIGEON_LOG_UPLOAD_BATCH_SIZE=128
CONFIG_PIGEON_LOG_UPLOAD_MAX_INTERVAL_MS=300000
# FOTA (task #3): shadow "firmware" target -> chunked, device-authed Range
# download straight into the external-flash MCUboot secondary slot (slot1 on
# the w25q32jv, board overlay) -> streamed sha256 verify -> one-time test
# swap -> graceful reboot. The image confirms itself only after its first
# successful departure fetch (fota.c confirm_image_if_healthy); until then
# MCUboot reverts on reset -- that's the anti-brick net, not a bug.
CONFIG_PIGEON_FOTA=y
# NCS dfu_target backend: the exact write/schedule path hardware-verified on
# real nRF9160 (pigeon tasks #23-24); pigeon's vendor-neutral default has no
# hardware pass yet. This is an NCS workspace, so the dependency is free.
CONFIG_PIGEON_FOTA_NCS=y
# DFU_TARGET drags its nRF91 modem-delta backend in by default; this sign
# only ever updates its application image.
CONFIG_DFU_TARGET_MODEM_DELTA=n
# 512 quarters the static buffer cost (chunk + dfu staging) vs the 2048
# default in this RAM-bound image -- the second halving (1024 -> 512,
# 2026-08-02) funds the SHADOW_CONFIG_MAX bump for the "displays" key.
# Price: ~4x the Range requests of the default (~500 for a ~250KB image,
# roughly 6-12 min on LTE-M with modem-TLS session reuse). Never raise
# past 2048 on this board: pigeon rides modem TLS here, and oversized
# responses hit the same modem recv limitation that pushed Swiftly off
# modem TLS (git 2639259).
CONFIG_PIGEON_FOTA_CHUNK_SIZE=512
# 100ms between FOTA chunks: opens periodic airtime windows so the day
# job's Swiftly fetch isn't starved for the whole download (the failure
# that burned all three attempts of the first live OTA test) -- costs
# ~95s on a ~949-chunk image. Pairs with main.c's bounded reset-policy
# suppression; see pigeon_client_fota_active().
CONFIG_PIGEON_FOTA_CHUNK_YIELD_MS=100
# CONFIG_PIGEON_FOTA_CURRENT_VERSION is NOT set here on purpose: it is
# derived from app/VERSION by CMakeLists.txt so it can never drift from the
# image's real version.
# CONFIG_PIGEON_REBOOT_ON_FATAL/_WATCHDOG deliberately NOT enabled here --
# see prj_release.conf's comment: this is the dev/debug profile, and
# pigeon's own Kconfig help explicitly recommends leaving reboot-on-fatal
# off while actively debugging on a dev board.
