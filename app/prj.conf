# TF-M's "profile not set" build (see CONFIG_TFM_PROFILE_TYPE_NOT_SET in this
# board's conf) unconditionally enables TFM_EXPERIMENTAL
CONFIG_WARN_EXPERIMENTAL=n

# Set LIBC
CONFIG_PICOLIBC=y

# PicolibC targets C17 and POSIX 2018 standards
CONFIG_STD_C17=y

# Enforce MISRA C standards
CONFIG_MISRA_SANE=y

# Enable FPU & FPU sharing
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Reset Reason and Reboot
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Power Management
CONFIG_PM_DEVICE=y

# Compiler optimizations
# Optimize for speed since space isn't a huge concern for this app
CONFIG_SPEED_OPTIMIZATIONS=y

# Flash operations.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_SETTINGS=y

# Watchdog timer
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Multiplexor drivers
CONFIG_GPIO=y
CONFIG_MULTIPLEXER=y

# Counter
CONFIG_COUNTER=y

# I2C
CONFIG_I2C=y

# PWM
CONFIG_PWM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_BUF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=n

# SNTP
CONFIG_SNTP=y

# Stack and heap configurations
# Main's stack has two big, SEQUENTIAL (never nested) consumers per
# update_stop pass: the Swiftly native-TLS/mbedTLS request frames, then
# parse_swiftly_json's jsmn token array. History matters here: 12288
# overflowed on real hardware (2026-08-01) when the token array was 742
# x 16B = ~11.9KB; 16384 then MEASURED 12764 peak via the thread
# analyzer (2026-08-08 bench watermark run). The RAM diet packed
# jsmntok_t to 8B AND raised the budget to the 934-token max shape
# (parse_swiftly.c) -- the parse local is now 7472B, projecting the peak
# to ~8.4K; 12288 gives ~45% margin over that projection and was
# re-verified green on hardware post-diet. MPU_STACK_GUARD stays the
# loud backstop. Do NOT grow STOP_TOK_COUNT/STOP_MAX_ROUTES or unpack
# jsmntok_t without redoing this arithmetic.
CONFIG_MAIN_STACK_SIZE=12288
# Increase heap size for networking operations
CONFIG_HEAP_MEM_POOL_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Enable MCUmgr and dependencies.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# 256 (was 512 'for transfer speeds'): newtmgr uploads are the legacy
# path now that FOTA is verified; slower serial DFU beats 256B of
# permanent RAM.
CONFIG_UART_MCUMGR_RX_BUF_SIZE=256
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# Sysworkq's biggest real user is the pigeon dictionary-log flush POST
# (http_client over a modem-TLS socket); measured peak 2096 of 4096
# (2026-08-08 thread-analyzer watermarks). 3072 keeps ~1KB margin.
# MCUmgr handlers run on their own transport workqueue, not here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Enable most MCUmgr core commands.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# Hardening
CONFIG_FORTIFY_SOURCE_COMPILE_TIME=y
CONFIG_STACK_SENTINEL=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_POINTER_RANDOM=100

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Embedded Departure Board"

# Logging
CONFIG_LOG=y
# 1 = Error, 2 = Warn, 3 = Info, 4 = Debug
CONFIG_LOG_DEFAULT_LEVEL=2

# Deferred mode (was minimal): CONFIG_PIGEON_LOG_UPLOAD's dictionary backend
# is a real log backend, and minimal mode never dispatches to backends at
# all -- the ring buffer would simply stay empty. The UART console backend
# still renders human-readable text in deferred mode (dictionary encoding is
# per-backend, not global), it's just flushed asynchronously by the log
# processing thread. That thread only runs at all because main's loop now
# sleeps between passes instead of k_cpu_idle()ing (see main.c).
CONFIG_LOG_MODE_DEFERRED=y
# Measured 696 peak of 1536 (2026-08-08 watermarks) at this WRN-level
# volume; 1024 keeps ~47% margin. Revisit together with any
# LOG_DEFAULT_LEVEL bump (higher levels mean bigger formatting frames).
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
# Deferred-mode core message buffer; WRN-level volume never came close
# to filling the 1024 default.
CONFIG_LOG_BUFFER_SIZE=768
# Measured 440 peak of 2048 (2026-08-08 watermarks); the ISR population
# here (UARTE/RTC/GPIO/IPC) nests shallowly. 1024 is 2.3x the measured
# peak.
CONFIG_ISR_STACK_SIZE=1024

